<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Color · Grey</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="card.css" />
</head>
<body>
  <div class="card">
    <div class="row-label">
      <span class="name">Grey</span>
      <span class="meta">--bk-grey-50 → --bk-grey-1000 · default Grey-600 #475569</span>
    </div>
    <div class="swatch-row" style="grid-template-columns: repeat(11, 1fr);">
      <div class="swatch light" style="background:#F8FAFC"><div class="step">50</div><div class="hex">#F8FAFC</div></div>
      <div class="swatch light" style="background:#F1F5F9"><div class="step">100</div><div class="hex">#F1F5F9</div></div>
      <div class="swatch light" style="background:#E2E8F0"><div class="step">200</div><div class="hex">#E2E8F0</div></div>
      <div class="swatch light" style="background:#CBD5E1"><div class="step">300</div><div class="hex">#CBD5E1</div></div>
      <div class="swatch light" style="background:#94A3B8"><div class="step">400</div><div class="hex">#94A3B8</div></div>
      <div class="swatch dark" style="background:#64748B"><div class="step">500</div><div class="hex">#64748B</div></div>
      <div class="swatch dark" style="background:#475569"><div class="step">600</div><div class="hex">#475569</div></div>
      <div class="swatch dark" style="background:#334155"><div class="step">700</div><div class="hex">#334155</div></div>
      <div class="swatch dark" style="background:#1E293B"><div class="step">800</div><div class="hex">#1E293B</div></div>
      <div class="swatch dark" style="background:#0F172A"><div class="step">900</div><div class="hex">#0F172A</div></div>
      <div class="swatch dark" style="background:#020617"><div class="step">1000</div><div class="hex">#020617</div></div>
    </div>
  </div>
</body>
</html>
