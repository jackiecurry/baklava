<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Color · Blue</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="card.css" />
</head>
<body>
  <div class="card">
    <div class="row-label">
      <span class="name">Blue</span>
      <span class="meta">--bk-blue-50 → --bk-blue-1000 · default Blue-600 #2563FF</span>
    </div>
    <div class="swatch-row" style="grid-template-columns: repeat(11, 1fr);">
      <div class="swatch light" style="background:#F5F8FF"><div class="step">50</div><div class="hex">#F5F8FF</div></div>
      <div class="swatch light" style="background:#EEF4FF"><div class="step">100</div><div class="hex">#EEF4FF</div></div>
      <div class="swatch light" style="background:#DCE8FF"><div class="step">200</div><div class="hex">#DCE8FF</div></div>
      <div class="swatch light" style="background:#B8D0FF"><div class="step">300</div><div class="hex">#B8D0FF</div></div>
      <div class="swatch light" style="background:#8CB2FF"><div class="step">400</div><div class="hex">#8CB2FF</div></div>
      <div class="swatch dark" style="background:#5C8EFF"><div class="step">500</div><div class="hex">#5C8EFF</div></div>
      <div class="swatch dark" style="background:#2563FF"><div class="step">600</div><div class="hex">#2563FF</div></div>
      <div class="swatch dark" style="background:#1749E8"><div class="step">700</div><div class="hex">#1749E8</div></div>
      <div class="swatch dark" style="background:#1237C0"><div class="step">800</div><div class="hex">#1237C0</div></div>
      <div class="swatch dark" style="background:#0B246E"><div class="step">900</div><div class="hex">#0B246E</div></div>
      <div class="swatch dark" style="background:#081A4D"><div class="step">1000</div><div class="hex">#081A4D</div></div>
    </div>
  </div>
</body>
</html>
