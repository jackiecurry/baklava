<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Color · Violet</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="card.css" />
</head>
<body>
  <div class="card">
    <div class="row-label">
      <span class="name">Violet</span>
      <span class="meta">--bk-violet-50 → --bk-violet-1000 · default Violet-600 #8B5CF6</span>
    </div>
    <div class="swatch-row" style="grid-template-columns: repeat(11, 1fr);">
      <div class="swatch light" style="background:#FBF8FF"><div class="step">50</div><div class="hex">#FBF8FF</div></div>
      <div class="swatch light" style="background:#F7F2FF"><div class="step">100</div><div class="hex">#F7F2FF</div></div>
      <div class="swatch light" style="background:#EFE5FF"><div class="step">200</div><div class="hex">#EFE5FF</div></div>
      <div class="swatch light" style="background:#DFC8FF"><div class="step">300</div><div class="hex">#DFC8FF</div></div>
      <div class="swatch light" style="background:#C9A3FF"><div class="step">400</div><div class="hex">#C9A3FF</div></div>
      <div class="swatch dark" style="background:#A970FF"><div class="step">500</div><div class="hex">#A970FF</div></div>
      <div class="swatch dark" style="background:#8B5CF6"><div class="step">600</div><div class="hex">#8B5CF6</div></div>
      <div class="swatch dark" style="background:#7644EA"><div class="step">700</div><div class="hex">#7644EA</div></div>
      <div class="swatch dark" style="background:#6133C5"><div class="step">800</div><div class="hex">#6133C5</div></div>
      <div class="swatch dark" style="background:#4A2897"><div class="step">900</div><div class="hex">#4A2897</div></div>
      <div class="swatch dark" style="background:#341E6A"><div class="step">1000</div><div class="hex">#341E6A</div></div>
    </div>
  </div>
</body>
</html>
