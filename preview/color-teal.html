<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Color · Teal</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="card.css" />
</head>
<body>
  <div class="card">
    <div class="row-label">
      <span class="name">Teal</span>
      <span class="meta">--bk-teal-50 → --bk-teal-1000 · default Teal-600 #0094B8</span>
    </div>
    <div class="swatch-row" style="grid-template-columns: repeat(11, 1fr);">
      <div class="swatch light" style="background:#ECFCFF"><div class="step">50</div><div class="hex">#ECFCFF</div></div>
      <div class="swatch light" style="background:#D5F8FF"><div class="step">100</div><div class="hex">#D5F8FF</div></div>
      <div class="swatch light" style="background:#A7F1FF"><div class="step">200</div><div class="hex">#A7F1FF</div></div>
      <div class="swatch light" style="background:#67E8FF"><div class="step">300</div><div class="hex">#67E8FF</div></div>
      <div class="swatch light" style="background:#22D3EE"><div class="step">400</div><div class="hex">#22D3EE</div></div>
      <div class="swatch dark" style="background:#00B8D9"><div class="step">500</div><div class="hex">#00B8D9</div></div>
      <div class="swatch dark" style="background:#0094B8"><div class="step">600</div><div class="hex">#0094B8</div></div>
      <div class="swatch dark" style="background:#007796"><div class="step">700</div><div class="hex">#007796</div></div>
      <div class="swatch dark" style="background:#005A73"><div class="step">800</div><div class="hex">#005A73</div></div>
      <div class="swatch dark" style="background:#003E50"><div class="step">900</div><div class="hex">#003E50</div></div>
      <div class="swatch dark" style="background:#00212B"><div class="step">1000</div><div class="hex">#00212B</div></div>
    </div>
  </div>
</body>
</html>
