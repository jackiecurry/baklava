<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Color · Pink</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="card.css" />
</head>
<body>
  <div class="card">
    <div class="row-label">
      <span class="name">Pink</span>
      <span class="meta">--bk-pink-50 → --bk-pink-1000 · default Pink-600 #FF2D8F</span>
    </div>
    <div class="swatch-row" style="grid-template-columns: repeat(11, 1fr);">
      <div class="swatch light" style="background:#FFF6FB"><div class="step">50</div><div class="hex">#FFF6FB</div></div>
      <div class="swatch light" style="background:#FFF0F8"><div class="step">100</div><div class="hex">#FFF0F8</div></div>
      <div class="swatch light" style="background:#FFE0F0"><div class="step">200</div><div class="hex">#FFE0F0</div></div>
      <div class="swatch light" style="background:#FFC0E2"><div class="step">300</div><div class="hex">#FFC0E2</div></div>
      <div class="swatch light" style="background:#FF95CC"><div class="step">400</div><div class="hex">#FF95CC</div></div>
      <div class="swatch dark" style="background:#FF5EAF"><div class="step">500</div><div class="hex">#FF5EAF</div></div>
      <div class="swatch dark" style="background:#FF2D8F"><div class="step">600</div><div class="hex">#FF2D8F</div></div>
      <div class="swatch dark" style="background:#E60073"><div class="step">700</div><div class="hex">#E60073</div></div>
      <div class="swatch dark" style="background:#BF005E"><div class="step">800</div><div class="hex">#BF005E</div></div>
      <div class="swatch dark" style="background:#8F0046"><div class="step">900</div><div class="hex">#8F0046</div></div>
      <div class="swatch dark" style="background:#660031"><div class="step">1000</div><div class="hex">#660031</div></div>
    </div>
  </div>
</body>
</html>
