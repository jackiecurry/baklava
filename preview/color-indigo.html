<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Color · Indigo</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="card.css" />
</head>
<body>
  <div class="card">
    <div class="row-label">
      <span class="name">Indigo</span>
      <span class="meta">--bk-indigo-50 → --bk-indigo-1000 · default Indigo-600 #474DE8</span>
    </div>
    <div class="swatch-row" style="grid-template-columns: repeat(11, 1fr);">
      <div class="swatch light" style="background:#F1F3FF"><div class="step">50</div><div class="hex">#F1F3FF</div></div>
      <div class="swatch light" style="background:#E2E7FF"><div class="step">100</div><div class="hex">#E2E7FF</div></div>
      <div class="swatch light" style="background:#C6CFFF"><div class="step">200</div><div class="hex">#C6CFFF</div></div>
      <div class="swatch light" style="background:#A5B2FF"><div class="step">300</div><div class="hex">#A5B2FF</div></div>
      <div class="swatch light" style="background:#7C89FF"><div class="step">400</div><div class="hex">#7C89FF</div></div>
      <div class="swatch dark" style="background:#5A63FF"><div class="step">500</div><div class="hex">#5A63FF</div></div>
      <div class="swatch dark" style="background:#474DE8"><div class="step">600</div><div class="hex">#474DE8</div></div>
      <div class="swatch dark" style="background:#393AC2"><div class="step">700</div><div class="hex">#393AC2</div></div>
      <div class="swatch dark" style="background:#2B2D8F"><div class="step">800</div><div class="hex">#2B2D8F</div></div>
      <div class="swatch dark" style="background:#1F2166"><div class="step">900</div><div class="hex">#1F2166</div></div>
      <div class="swatch dark" style="background:#101136"><div class="step">1000</div><div class="hex">#101136</div></div>
    </div>
  </div>
</body>
</html>
